name: Build & Publish Docker Image
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  packages: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:buildcache,mode=max

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          REPO_NAME=${{ github.event.repository.name }}
          OWNER=${{ env.OWNER_LC }}
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /orgs/${OWNER}/packages/container/${REPO_NAME} \
            -f visibility=public \
          || gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/${REPO_NAME} \
            -f visibility=public
