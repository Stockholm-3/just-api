name: Build & Publish Docker Image
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  packages: write
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository
      - uses: actions/checkout@v4

      # 2. Convert GitHub owner to lowercase (Docker requires lowercase)
      - name: Set lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # 3. Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and push the Docker image with caching
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:buildcache,mode=max

      # 6. Make the GHCR package public (gh CLI is pre-installed on ubuntu-latest)
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_NAME=${{ github.event.repository.name }}
          OWNER=${{ env.OWNER_LC }}

          # Try org endpoint first, fall back to user endpoint
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /orgs/${OWNER}/packages/container/${REPO_NAME} \
            -f visibility=public \
          || gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/${REPO_NAME} \
            -f visibility=public
